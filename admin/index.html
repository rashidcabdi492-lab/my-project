<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaris FC - Admin Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="container">
        <form id="login-form">
            <h1>Admin Login</h1>
            <p class="subtitle">Polaris FC Dashboard</p>

            <div id="error-message"></div>

            <div class="form">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
            </div>

            <div class="form">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
            </div>

            <button type="submit" id="submit">Sign In</button>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
